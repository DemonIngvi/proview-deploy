# Small footprint for a dev/test cluster (kind, minikube, k3d): single-node
# infrastructure, no autoscaling, one replica per service.
kafka:
  replicas: 1
  replicationFactor: 1
  minInsyncReplicas: 1
  storage: 5Gi
  resources: { requests: { cpu: 250m, memory: 1Gi }, limits: { memory: 1Gi } }
  topic: { partitions: 6 }
postgres:
  instances: 1
  storage: 1Gi
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
clickhouse:
  replicas: 1
  storage: 5Gi
  resources: { requests: { cpu: 250m, memory: 1Gi }, limits: { memory: 2Gi } }
  keeper: { replicas: 1, storage: 1Gi }

proview-banner-service: &small
  autoscaling: { enabled: false }
  replicaCount: 1
  podDisruptionBudget: { enabled: false }
proview-event-collector: *small
proview-event-ingester:
  autoscaling: { enabled: false }
  replicaCount: 1
  podDisruptionBudget: { enabled: false }
  env:
    CLICKHOUSE_DB_ENGINE: Atomic
proview-analytics: *small
proview-web: *small
