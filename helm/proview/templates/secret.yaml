{{- if not .Values.secrets.existingSecret }}
{{- $v := .Values.secrets.values }}
# Development secret. Production: create "{{ .Values.secrets.name }}" outside
# Helm with the same keys and set secrets.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels: {{- include "proview.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  TOKEN_SECRET: {{ required "secrets.values.TOKEN_SECRET" $v.TOKEN_SECRET | quote }}
  TOKEN_KEYS: {{ printf "%s:%s" .Values.secrets.tokenKeyID $v.TOKEN_SECRET | quote }}
  BANNER_ADMIN_TOKEN: {{ required "secrets.values.BANNER_ADMIN_TOKEN" $v.BANNER_ADMIN_TOKEN | quote }}
  ADMIN_PASSWORD: {{ required "secrets.values.ADMIN_PASSWORD" $v.ADMIN_PASSWORD | quote }}
  CLICKHOUSE_PASSWORD: {{ required "secrets.values.CLICKHOUSE_PASSWORD" $v.CLICKHOUSE_PASSWORD | quote }}
  CLICKHOUSE_RO_PASSWORD: {{ required "secrets.values.CLICKHOUSE_RO_PASSWORD" $v.CLICKHOUSE_RO_PASSWORD | quote }}
{{- end }}
