name: ci

# End-to-end and chaos tests of the whole platform built from the main
# branches of all service repositories, plus validation of the umbrella chart.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 3 * * *"   # nightly: catches cross-repo contract drift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPOS: proview-banner-service proview-event-collector proview-event-ingester proview-analytics proview-web

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { path: proview-deploy }
      - name: Checkout service repositories side by side
        run: |
          for r in $REPOS; do
            git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY_OWNER}/$r.git" "$r"
          done
      - uses: actions/setup-go@v6
        with: { go-version: "1.26" }
      - name: Build, start stack and run e2e tests
        working-directory: proview-deploy
        run: scripts/e2e.sh
      - name: Chaos tests (ClickHouse outage, ingester SIGKILL)
        working-directory: proview-deploy
        run: scripts/chaos.sh
      - name: Short load test (k6)
        working-directory: proview-deploy
        run: |
          docker run --rm --network host -v "$PWD/load:/load" grafana/k6:latest run --quiet \
            -e RPS=1000 -e DURATION=30s /load/k6-pageviews.js
      - name: Logs on failure
        if: failure()
        working-directory: proview-deploy/compose
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        working-directory: proview-deploy/compose
        run: docker compose down -v

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { path: proview-deploy }
      - run: for r in $REPOS; do git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY_OWNER}/$r.git" "$r"; done
      - uses: azure/setup-helm@v4
      - name: Lint and validate all profiles (CRDs against the datree catalog)
        working-directory: proview-deploy
        run: |
          scripts/helm-local-deps.sh
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for prof in "" "-f helm/proview/values-dev.yaml" "-f helm/proview/values-prod.yaml"; do
            helm lint helm/proview --strict $prof
            helm template proview helm/proview -n proview $prof | ./kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.26" }
      - name: Vet e2e and tools
        run: |
          (cd e2e && go vet -tags e2e ./...)
          (cd tools && go vet ./...)

  release:
    needs: [e2e, helm, tools]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Publish umbrella chart (dependencies from GHCR)
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm dependency build helm/proview
          helm package helm/proview --version "$V" --app-version "$V"
          helm push proview-"$V".tgz oci://ghcr.io/demoningvi/charts
