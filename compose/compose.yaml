# Full ProView stack for local development, demos and end-to-end tests.
#
#   cp .env.example .env
#   docker compose up -d --build     # builds from sibling repositories (../../proview-*)
#   PROVIEW_TAG=0.1.0 docker compose up -d --no-build   # or use published GHCR images
#
# Site:      http://localhost:8080        Analytics: http://localhost:8090 (admin / $ADMIN_PASSWORD)
# Banner management API: http://localhost:8081/admin/v1/banners (Bearer $BANNER_ADMIN_TOKEN)
name: proview

x-go-service: &go-service
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: proview
      POSTGRES_USER: proview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proview -d proview"]
      interval: 2s
      timeout: 2s
      retries: 30

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        $$T --bootstrap-server kafka:9092 --create --if-not-exists --topic proview.events.v1 --partitions 12 --replication-factor 1 --config retention.ms=604800000 --config compression.type=producer
        $$T --bootstrap-server kafka:9092 --create --if-not-exists --topic proview.events.dlq --partitions 3 --replication-factor 1 --config retention.ms=1209600000
        $$T --bootstrap-server kafka:9092 --list
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: proview
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
      CLICKHOUSE_RO_PASSWORD: ${CLICKHOUSE_RO_PASSWORD:?set in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    volumes:
      - ch-data:/var/lib/clickhouse
      - ./clickhouse/users.d/readonly.xml:/etc/clickhouse-server/users.d/readonly.xml:ro
    ports: ["127.0.0.1:8123:8123"]
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user proview --password \"$$CLICKHOUSE_PASSWORD\" -q 'SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 40

  banner-migrate:
    <<: *go-service
    image: ghcr.io/demoningvi/proview-banner-service:${PROVIEW_TAG:-latest}
    build: ../../proview-banner-service
    restart: "no"
    command: ["migrate"]
    environment:
      POSTGRES_DSN: postgres://proview:${POSTGRES_PASSWORD}@postgres:5432/proview?sslmode=disable
    depends_on: { postgres: { condition: service_healthy } }

  banner-service:
    <<: *go-service
    image: ghcr.io/demoningvi/proview-banner-service:${PROVIEW_TAG:-latest}
    build: ../../proview-banner-service
    environment:
      POSTGRES_DSN: postgres://proview:${POSTGRES_PASSWORD}@postgres:5432/proview?sslmode=disable
      TOKEN_KEY_ID: k1
      TOKEN_SECRET: ${TOKEN_SECRET:?set in .env}
      ADMIN_TOKEN: ${BANNER_ADMIN_TOKEN:?set in .env}
      REFRESH_INTERVAL: 5s
      SHUTDOWN_DELAY: 1s
    ports: ["127.0.0.1:8081:8081"]
    depends_on: { banner-migrate: { condition: service_completed_successfully } }

  event-collector:
    <<: *go-service
    image: ghcr.io/demoningvi/proview-event-collector:${PROVIEW_TAG:-latest}
    build: ../../proview-event-collector
    environment:
      KAFKA_BROKERS: kafka:9092
      TOKEN_KEYS: k1:${TOKEN_SECRET}
      SHUTDOWN_DELAY: 1s
    depends_on: { kafka-init: { condition: service_completed_successfully } }

  ingester-migrate:
    <<: *go-service
    image: ghcr.io/demoningvi/proview-event-ingester:${PROVIEW_TAG:-latest}
    build: ../../proview-event-ingester
    restart: "no"
    command: ["migrate"]
    environment:
      CLICKHOUSE_ADDRS: clickhouse:9000
      CLICKHOUSE_USER: proview
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    depends_on: { clickhouse: { condition: service_healthy } }

  event-ingester:
    <<: *go-service
    image: ghcr.io/demoningvi/proview-event-ingester:${PROVIEW_TAG:-latest}
    build: ../../proview-event-ingester
    environment:
      KAFKA_BROKERS: kafka:9092
      CLICKHOUSE_ADDRS: clickhouse:9000
      CLICKHOUSE_USER: proview
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      BATCH_SIZE: "5000"
      FLUSH_INTERVAL: 1s
    depends_on:
      ingester-migrate: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }

  analytics:
    <<: *go-service
    image: ghcr.io/demoningvi/proview-analytics:${PROVIEW_TAG:-latest}
    build: ../../proview-analytics
    environment:
      CLICKHOUSE_ADDRS: clickhouse:9000
      CLICKHOUSE_USER: proview_ro
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_RO_PASSWORD}
      ADMIN_USER: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in .env}
      BANNER_ADMIN_URL: http://banner-service:8081
      BANNER_ADMIN_TOKEN: ${BANNER_ADMIN_TOKEN}
      CACHE_TTL: 5s
    ports: ["127.0.0.1:8090:8080"]
    depends_on: { ingester-migrate: { condition: service_completed_successfully } }

  web:
    image: ghcr.io/demoningvi/proview-web:${PROVIEW_TAG:-latest}
    build: ../../proview-web
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    tmpfs:
      - /tmp:uid=65532,gid=65532
      - /etc/nginx/conf.d:uid=65532,gid=65532
    environment:
      BANNER_UPSTREAM: banner-service:8080
      COLLECTOR_UPSTREAM: event-collector:8080
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [banner-service, event-collector]

volumes:
  pg-data:
  kafka-data:
  ch-data:
